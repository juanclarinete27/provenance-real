name: Build Provenance IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install Ruby dependencies
        run: |
          bundle install

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace Provenance.xcworkspace \
            -scheme Provenance-Release \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Provenance.app" Payload/
          zip -r Provenance-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Provenance-iOS-unsigned
          path: Provenance-iOS-unsigned.ipa
